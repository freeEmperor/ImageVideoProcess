[build-system]
# 显式声明构建后端：src 布局 + 可编辑安装（uv sync 会调用它生成 .pth）
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imagevideoprocess"
version = "0.1.0"
description = "Windows 桌面端批量图像 / 视频处理工具（压缩、缩放、超分、格式转换、抽帧）"
readme = "README.md"
requires-python = ">=3.13,<3.14"
keywords = ["image", "video", "opencv", "ffmpeg", "pyside6", "windows"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "numpy>=2.1", "Pillow>=11.1", "PySide6>=6.8.1", "qtawesome>=1.4.0",
    "opencv-python-headless>=5.0,<5.1", "imageio-ffmpeg>=0.5.1",
    "av>=13.1", "pillow-heif>=0.21",
]

[project.scripts]
imagevideoprocess = "imagevideoprocess.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9", "mypy>=1.14"]
packaging = ["pyinstaller>=6.11"]

[tool.uv]
python-preference = "only-managed"
package = true
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/imagevideoprocess"]

# ---------------------------------------------------------------------------
# 工具配置
# ---------------------------------------------------------------------------
[tool.ruff]
cache-dir = "build/ruff-cache"
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# 必须排除环境目录，否则 ruff 会去检查 .venv 里的第三方代码
extend-exclude = [
    ".venv",
    ".uv-cache",
    ".uv-packages",
    ".uv-python",
    ".smoke-tmp",
    ".pytest-tmp",
    "build",
    "dist",
    "processed",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # 行宽交给 formatter，中文注释按字符数算会误报
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
cache_dir = "build/mypy-cache"
python_version = "3.13"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests/support"]
# -p no:cacheprovider：pytest 的缓存写入用 mkdtemp（0o700 目录），在权限被收紧的
# 环境下会报 WinError 5；关掉它可去掉噪音，代价只是没有 --lf/--ff 增量运行。
addopts = "-ra --strict-markers -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
# 说明：临时目录由 tests/conftest.py 的 tmp_dir fixture 提供（普通 mkdir，
# 不用 tempfile.mkdtemp）。如需换位置，设环境变量 DSH_TEST_TMP。
